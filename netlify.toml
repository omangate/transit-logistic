[build]
  command = "node scripts/netlify-build.mjs"
  publish = "apps/web/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "development"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_USE_PNPM = "true"
  NETLIFY_SKIP_INSTALL = "true"
  NEXT_PUBLIC_USE_SAME_ORIGIN_API = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@nestjs/microservices", "sharp", "class-transformer", "class-validator", "reflect-metadata"]
  included_files = [
    "apps/api/dist/**",
    "apps/api/prisma/schema.prisma",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**"
  ]

[functions.api]
  timeout = 26
  memory = 1024

[functions.uploads]
  timeout = 10

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/uploads/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
